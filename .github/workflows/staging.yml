name: Deploy Staging to GitHub Pages

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "staging-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject staging config
        run: |
          # Replace Supabase keys with staging values if STAGING_SUPABASE_URL is set
          if [ -n "$STAGING_SUPABASE_URL" ]; then
            echo "Applying staging Supabase config..."
            find . -name "*.js" -not -path "./node_modules/*" -exec sed -i \
              -e "s|https://[^\\.]*\\.supabase\\.co|$STAGING_SUPABASE_URL|g" \
              -e "s|eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*|$STAGING_SUPABASE_ANON|g" \
              {} \; 2>/dev/null || true
          fi
          
          # Add staging banner
          for f in index.html; do
            if [ -f "$f" ]; then
              sed -i 's|<body|<body>\n<div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#E74C3C;color:white;text-align:center;padding:8px;font-size:14px;font-weight:600">STAGING ENVIRONMENT - Not for production use</div>\n<div style="height:36px"></div>|' "$f"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
