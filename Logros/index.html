*{box-sizing:border-box;margin:0;padding:0}
:root{
  --lila:#7B5EA7;--lila-l:#F0EBF8;--lila-d:#4E3470;
  --rosa:#C96B7A;--rosa-l:#FDF0F2;
  --oro:#B8943A;--oro-l:#FBF6E8;
  --verde:#3BAF7A;--verde-l:#E8F8F1;
  --turquesa:#1A9E8F;--turquesa-l:#E6F7F5;
  --bg:#F8F5FF;--card:#FDFCFB;--texto:#2C2240;--suave:#7A6E85;
  --borde:rgba(123,94,167,0.13);
  --crema:#FBF8F4;
}
[data-theme="dark"]{
  --bg:#1A0E30;--card:#241545;--texto:#E8E0F0;--suave:#9B8FB0;
  --borde:rgba(123,94,167,0.25);--crema:#1E1238;
  --lila-l:#2D1855;--rosa-l:#3D1A25;--oro-l:#3D3010;--verde-l:#1A3025;--turquesa-l:#1A2D2A;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--texto);min-height:100vh}

/* Layout */
.page{max-width:800px;margin:0 auto;padding:16px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--suave);text-decoration:none;font-size:13px;margin-bottom:16px;cursor:pointer}
.back-btn:hover{color:var(--lila)}

/* Hero Stats */
.hero{background:linear-gradient(135deg,#1A0E30 0%,#2D1855 50%,#4E3470 100%);border-radius:20px;padding:28px 24px;color:white;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(94,212,160,0.12) 0%,transparent 70%)}
.hero::after{content:'';position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(184,148,58,0.08) 0%,transparent 70%)}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;margin-bottom:4px;position:relative;z-index:1}
.hero-sub{font-size:13px;opacity:0.7;margin-bottom:20px;position:relative;z-index:1}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative;z-index:1}
.hero-stat{text-align:center;padding:14px 8px;background:rgba(255,255,255,0.08);border-radius:14px;backdrop-filter:blur(4px)}
.hero-stat-num{font-size:28px;font-weight:700;line-height:1}
.hero-stat-label{font-size:10px;opacity:0.6;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}

/* XP Progress */
.xp-bar-wrap{margin-top:16px;position:relative;z-index:1}
.xp-bar-header{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px;opacity:0.7}
.xp-bar{height:6px;background:rgba(255,255,255,0.12);border-radius:3px;overflow:hidden}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,#5ED4A0,#1A9E8F);border-radius:3px;transition:width 1s ease}

/* Filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:8px 16px;border:1px solid var(--borde);border-radius:100px;background:white;color:var(--suave);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.filter-btn.active{background:var(--lila);color:white;border-color:var(--lila)}
.filter-btn:hover{border-color:var(--lila)}
[data-theme="dark"] .filter-btn{background:var(--card)}

/* Badge Grid */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.badge-card{background:var(--card);border-radius:16px;padding:18px 12px;text-align:center;cursor:pointer;transition:all 0.3s;border:1px solid var(--borde);position:relative;overflow:hidden}
.badge-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.badge-card.locked{opacity:0.45;filter:grayscale(0.8)}
.badge-card.locked:hover{opacity:0.6}
.badge-icon{font-size:36px;margin-bottom:8px;display:block;transition:transform 0.3s}
.badge-card:hover .badge-icon{transform:scale(1.15)}
.badge-name{font-size:12px;font-weight:600;color:var(--texto);line-height:1.3;margin-bottom:4px}
.badge-tier{display:inline-block;font-size:9px;font-weight:600;padding:2px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:0.5px}
.tier-bronze{background:#F5E6D0;color:#8B6914}
.tier-silver{background:#E8E8E8;color:#666}
.tier-gold{background:#FFF3D0;color:#B8943A}
.tier-diamond{background:#E0F0FF;color:#4A90D9}
.badge-date{font-size:9px;color:var(--suave);margin-top:6px}
.badge-check{position:absolute;top:8px;right:8px;width:20px;height:20px;background:linear-gradient(135deg,#5ED4A0,#1A9E8F);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:white}

/* Locked overlay */
.locked-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:0.3}

/* Section titles */
.section-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--texto);margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--suave)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:14px;line-height:1.5}

/* Share modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s}
.modal{background:white;border-radius:20px;padding:24px;max-width:360px;width:100%;text-align:center;animation:slideUp 0.3s}
[data-theme="dark"] .modal{background:var(--card)}
.modal-icon{font-size:56px;margin-bottom:12px}
.modal-name{font-size:18px;font-weight:700;margin-bottom:4px}
.modal-desc{font-size:13px;color:var(--suave);margin-bottom:16px;line-height:1.4}
.modal-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.modal-btn{padding:10px 18px;border:none;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;transition:transform 0.15s}
.modal-btn:hover{transform:scale(1.03)}
.modal-close{background:none;border:1px solid var(--borde);color:var(--suave)}
.modal-share{background:linear-gradient(135deg,#7B5EA7,#A78BDB);color:white}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.badge-card{animation:popIn 0.3s ease backwards}
.badge-card:nth-child(1){animation-delay:0.02s}
.badge-card:nth-child(2){animation-delay:0.04s}
.badge-card:nth-child(3){animation-delay:0.06s}
.badge-card:nth-child(4){animation-delay:0.08s}
.badge-card:nth-child(5){animation-delay:0.10s}
.badge-card:nth-child(6){animation-delay:0.12s}
.badge-card:nth-child(7){animation-delay:0.14s}
.badge-card:nth-child(8){animation-delay:0.16s}

/* Confetti */
.confetti{position:fixed;top:-10px;z-index:1000;pointer-events:none;animation:confettiFall 3s linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

@media(max-width:480px){
  .badge-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .badge-card{padding:14px 8px}
  .badge-icon{font-size:30px}
  .hero-stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .hero-stat{padding:10px 4px}
  .hero-stat-num{font-size:22px}
}

  week_streak_share: { icon: '📈', name: { es: 'Racha de sharing', en: 'Share Streak' }, tier: 'bronze', cat: 'social', desc: { es: 'Código compartido 7 días seguidos', en: 'Shared your code 7 days in a row' } }
};

const TIER_COLORS = { bronze: 'tier-bronze', silver: 'tier-silver', gold: 'tier-gold', diamond: 'tier-diamond' };
const TIER_LABELS = { es: { bronze: 'Bronce', silver: 'Plata', gold: 'Oro', diamond: 'Diamante' }, en: { bronze: 'Bronze', silver: 'Silver', gold: 'Gold', diamond: 'Diamond' } };
const XP_LEVELS = [0, 500, 1500, 3500, 7000, 12000, 20000];

const Achievements = {
  _earned: [],
  _filter: 'all',
  _selectedBadge: null,

  async init() {
    if (!initSupabase()) { setTimeout(() => this.init(), 200); return; }
    await checkAuth();
    if (!currentUser) return;

    this._render();
    await this._loadData();
    this._setupFilters();
  },

  async _loadData() {
    try {
      // Get earned badges
      const { data: badges } = await supabase
        .from('yayika_badges')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('earned_at', { ascending: false });

      this._earned = badges || [];

      // Get progress (XP, streak)
      const { data: progress } = await supabase
        .from('yayika_progress')
        .select('xp_total, streak_days')
        .eq('user_id', currentUser.id)
        .single();

      this._xp = progress?.xp_total || 0;
      this._streak = progress?.streak_days || 0;

      this._updateHero();
      this._renderBadges();
    } catch (e) {
      console.warn('Load data error:', e);
      this._xp = 0;
      this._streak = 0;
      this._earned = [];
      this._updateHero();
      this._renderBadges();
    }
  },

  _updateHero() {
    document.getElementById('totalXP').textContent = this._xp;
    document.getElementById('totalBadges').textContent = this._earned.length;
    document.getElementById('totalStreak').textContent = this._streak;

    // XP level
    let level = 1;
    for (let i = XP_LEVELS.length - 1; i >= 0; i--) {
      if (this._xp >= XP_LEVELS[i]) { level = i + 1; break; }
    }
    const nextLevelXP = XP_LEVELS[level] || XP_LEVELS[XP_LEVELS.length - 1] + 10000;
    const prevLevelXP = XP_LEVELS[level - 1] || 0;
    const progress = Math.min(100, ((this._xp - prevLevelXP) / (nextLevelXP - prevLevelXP)) * 100);

    document.getElementById('xpLevel').textContent = `${typeof t === 'function' ? t('logros_level') : 'Nivel'} ${level}`;
    document.getElementById('xpProgress').textContent = `${this._xp} / ${nextLevelXP} XP`;
    document.getElementById('xpBarFill').style.width = `${progress}%`;
  },

  _renderBadges() {
    const lang = currentLang || 'es';
    const earnedKeys = new Set(this._earned.map(b => b.badge_key));
    const earned = [];
    const locked = [];

    for (const [key, def] of Object.entries(BADGE_DEFS)) {
      const isEarned = earnedKeys.has(key);
      const earnedData = this._earned.find(b => b.badge_key === key);
      const card = {
        key,
        ...def,
        earned: isEarned,
        earnedAt: earnedData?.earned_at,
        name: def.name[lang] || def.name.es,
        desc: def.desc[lang] || def.desc.es,
      };
      if (isEarned) earned.push(card);
      else locked.push(card);
    }

    document.getElementById('earnedCount').textContent = `(${earned.length})`;
    document.getElementById('lockedCount').textContent = `(${locked.length})`;

    const earnedGrid = document.getElementById('earnedGrid');
    const lockedGrid = document.getElementById('lockedGrid');
    const emptyState = document.getElementById('emptyState');
    const lockedSection = document.getElementById('lockedSection');

    if (earned.length === 0 && locked.length === 0) {
      emptyState.style.display = 'block';
      document.getElementById('earnedSection').style.display = 'none';
      lockedSection.style.display = 'none';
      return;
    }

    emptyState.style.display = 'none';
    document.getElementById('earnedSection').style.display = 'block';
    lockedSection.style.display = 'block';

    earnedGrid.innerHTML = earned.filter(b => this._filter === 'all' || b.cat === this._filter).map(b => this._badgeCard(b, true)).join('');
    lockedGrid.innerHTML = locked.filter(b => this._filter === 'all' || b.cat === this._filter).map(b => this._badgeCard(b, false)).join('');

    if (earned.filter(b => this._filter === 'all' || b.cat === this._filter).length === 0) {
      earnedGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--suave);font-size:12px">${typeof t === 'function' ? t('logros_no_badges_category') : 'No hay badges en esta categoría'}</div>`;
    }
    if (locked.filter(b => this._filter === 'all' || b.cat === this._filter).length === 0) {
      lockedGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--suave);font-size:12px">${typeof t === 'function' ? t('logros_all_unlocked_category') : '¡Todos desbloqueados en esta categoría! 🎉'}</div>`;
    }
  },

  _badgeCard(badge, isEarned) {
    const date = badge.earnedAt ? new Date(badge.earnedAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '';
    return `
      <div class="badge-card ${isEarned ? '' : 'locked'}" onclick="Achievements.showBadge('${badge.key}')" style="${isEarned ? '' : ''}">
        ${isEarned ? '<div class="badge-check">✓</div>' : ''}
        <span class="badge-icon">${badge.icon}</span>
        <div class="badge-name">${badge.name}</div>
        <span class="badge-tier ${TIER_COLORS[badge.tier]}">${TIER_LABELS[lang]?.[badge.tier] || badge.tier}</span>
        ${isEarned && date ? `<div class="badge-date">${date}</div>` : ''}
        ${!isEarned ? '<div class="locked-overlay">🔒</div>' : ''}
      </div>
    `;
  },

  _setupFilters() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this._filter = btn.dataset.filter;
        this._renderBadges();
      });
    });
  },

  showBadge(key) {
    const def = BADGE_DEFS[key];
    if (!def) return;
    const lang = currentLang || 'es';
    const isEarned = this._earned.some(b => b.badge_key === key);

    this._selectedBadge = { key, ...def, earned: isEarned };

    document.getElementById('modalIcon').textContent = def.icon;
    document.getElementById('modalName').textContent = def.name[lang] || def.name.es;
    document.getElementById('modalDesc').textContent = isEarned
      ? (def.desc[lang] || def.desc.es)
      : (typeof t === 'function' ? t('logros_unlock_hint') : '🔒 Completa el reto para desbloquear este badge');
    const tierEl = document.getElementById('modalTier');
    tierEl.textContent = (TIER_LABELS[lang] || TIER_LABELS.es)[def.tier];
    tierEl.className = `badge-tier ${TIER_COLORS[def.tier]}`;

    document.getElementById('shareModal').style.display = 'flex';
  },

  closeModal() {
    document.getElementById('shareModal').style.display = 'none';
    this._selectedBadge = null;
  },

  shareBadge() {
    const b = this._selectedBadge;
    if (!b) return;
    const lang = currentLang || 'es';
    const shareText = b.earned ? t('logros_share_earned') : t('logros_share_join');
    const text = `🏆 ${b.name[lang] || b.name.es}\n\n${b.desc[lang] || b.desc.es}\n\n${shareText}\nhttps://yayika.com`;

    if (navigator.share) {
      navigator.share({ title: t('logros_share_title'), text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text);
      this._showToast(t('logros_copied'));
    }
    this.closeModal();
  },

  _showToast(msg) {
    const existing = document.getElementById('logrosToast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.id = 'logrosToast';
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:100px;color:white;font-size:12px;font-weight:600;background:linear-gradient(135deg,#7B5EA7,#A78BDB);z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.15);cursor:pointer';
    toast.textContent = msg;
    toast.onclick = () => toast.remove();
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }
};

// Init on load
document.addEventListener('DOMContentLoaded', () => Achievements.init());
</script>

  <script src="../js/security.js"></script>
</body>
