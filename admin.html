<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yayika — Panel de Administración</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<style>
  :root {
    --lila: #7B5EA7; --lila-l: #F0EBF8; --lila-d: #4E3470;
    --rosa: #C96B7A; --rosa-l: #FDF0F2;
    --oro: #B8943A; --oro-l: #FBF6E8;
    --turquesa: #1A9E8F; --turquesa-l: #E0F7F4; --turquesa-d: #0E7A6D;
    --crema: #FAF7F2; --blanco: #FDFCFB;
    --texto: #1E1528; --suave: #7A6E85;
    --borde: rgba(123,94,167,0.12);
    --verde: #3BAF7A; --verde-l: #E8F8F0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--crema); color:var(--texto); min-height:100vh; }

  /* LOGIN */
  #loginScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .login-card { background:var(--blanco); border:1px solid var(--borde); border-radius:20px; padding:40px; max-width:400px; width:100%; box-shadow:0 8px 40px rgba(78,52,112,0.08); }
  .login-logo { font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:700; color:var(--lila-d); text-align:center; margin-bottom:8px; }
  .login-logo span { color:var(--rosa); }
  .login-sub { text-align:center; font-size:13px; color:var(--suave); margin-bottom:28px; }
  .login-field { margin-bottom:16px; }
  .login-field label { display:block; font-size:12px; font-weight:500; color:var(--suave); margin-bottom:6px; }
  .login-field input { width:100%; padding:12px 14px; border:1.5px solid var(--borde); border-radius:12px; font-size:14px; font-family:inherit; background:var(--crema); color:var(--texto); outline:none; transition:border .2s; }
  .login-field input:focus { border-color:var(--lila); }
  .login-btn { width:100%; padding:12px; border:none; border-radius:12px; background:var(--lila); color:white; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s; }
  .login-btn:hover { background:var(--lila-d); }
  .login-btn:disabled { opacity:.5; cursor:not-allowed; }
  .login-error { color:var(--rosa); font-size:12px; text-align:center; margin-top:12px; display:none; }
  .login-footer { text-align:center; margin-top:20px; font-size:11px; color:var(--suave); }

  /* DASHBOARD */
  #dashScreen { display:none; }
  .dash-header { background:var(--lila-d); color:white; padding:20px 28px; display:flex; justify-content:space-between; align-items:center; }
  .dash-header h1 { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:700; }
  .dash-header h1 span { color:var(--rosa); }
  .dash-logout { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.25); color:white; padding:8px 16px; border-radius:10px; font-size:12px; cursor:pointer; font-family:inherit; }
  .dash-logout:hover { background:rgba(255,255,255,0.25); }
  .dash-body { padding:24px 28px; max-width:1200px; margin:0 auto; }

  /* STATS */
  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
  .stat-card { background:var(--blanco); border:1px solid var(--borde); border-radius:14px; padding:20px; text-align:center; }
  .stat-num { font-size:28px; font-weight:700; margin-bottom:4px; }
  .stat-num.turquesa { color:var(--turquesa); }
  .stat-num.verde { color:var(--verde); }
  .stat-num.oro { color:var(--oro); }
  .stat-num.lila { color:var(--lila); }
  .stat-label { font-size:12px; color:var(--suave); }

  /* TABS */
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab-btn { padding:8px 16px; border-radius:100px; border:1.5px solid var(--borde); background:var(--crema); color:var(--suave); font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; transition:all .2s; }
  .tab-btn.active { border-color:var(--turquesa); background:var(--turquesa-l); color:var(--turquesa-d); }
  .tab-btn:hover { border-color:var(--lila); }

  /* TABLE */
  .table-wrap { background:var(--blanco); border:1px solid var(--borde); border-radius:14px; padding:20px; overflow-x:auto; }
  .table-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
  .table-header span { font-size:14px; font-weight:500; color:var(--texto); }
  table { width:100%; border-collapse:collapse; }
  th { padding:8px; font-size:11px; color:var(--suave); font-weight:500; text-align:left; border-bottom:1px solid var(--borde); }
  td { padding:10px 8px; font-size:13px; color:var(--texto); border-bottom:0.5px solid var(--borde); }
  .badge { font-size:10px; padding:3px 8px; border-radius:100px; font-weight:500; }
  .badge-green { background:var(--verde-l); color:var(--verde); }
  .badge-red { background:#FDE8EA; color:#E74C3C; }
  .badge-gray { background:#F0F0F0; color:#95A5A6; }
  .badge-lila { background:var(--lila-l); color:var(--lila-d); }
  .badge-rosa { background:var(--rosa-l); color:var(--rosa); }
  .badge-oro { background:var(--oro-l); color:var(--oro); }

  .plan-counts { display:flex; gap:10px; font-size:12px; }
  .plan-counts span { display:flex; align-items:center; gap:4px; }

  .rev-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:20px; }
  .rev-card { text-align:center; padding:20px; border-radius:12px; }
  .rev-card.green { background:var(--verde-l); }
  .rev-card.gold { background:var(--oro-l); }
  .rev-card.purple { background:var(--lila-l); }
  .rev-amount { font-size:28px; font-weight:700; }
  .rev-label { font-size:12px; color:var(--suave); margin-top:4px; }

  .plans-dist { padding:16px; background:var(--crema); border-radius:12px; }
  .plans-dist h4 { font-size:14px; font-weight:500; color:var(--texto); margin-bottom:12px; }
  .plans-row { display:flex; gap:16px; }
  .plan-item { flex:1; text-align:center; padding:12px; border-radius:8px; }
  .plan-item.green { background:var(--verde-l); }
  .plan-item.rosa { background:var(--rosa-l); }
  .plan-item.gold { background:var(--oro-l); }
  .plan-num { font-size:20px; font-weight:600; }
  .plan-label { font-size:11px; color:var(--suave); }

  .empty-msg { text-align:center; padding:40px; color:var(--suave); font-size:13px; }

  /* SEARCH & FILTERS */
  .search-bar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .search-input { flex:1; min-width:200px; padding:10px 14px; border:1.5px solid var(--borde); border-radius:12px; font-size:13px; font-family:inherit; background:var(--blanco); color:var(--texto); outline:none; transition:border .2s; }
  .search-input:focus { border-color:var(--lila); }
  .filter-select { padding:10px 14px; border:1.5px solid var(--borde); border-radius:12px; font-size:13px; font-family:inherit; background:var(--blanco); color:var(--texto); outline:none; cursor:pointer; }

  /* ACTION BUTTONS */
  .action-btn { padding:5px 12px; border-radius:8px; border:none; font-size:11px; font-weight:500; cursor:pointer; font-family:inherit; transition:all .2s; }
  .action-btn.edit { background:var(--lila-l); color:var(--lila-d); }
  .action-btn.edit:hover { background:var(--lila); color:white; }
  .action-btn.ban { background:#FDE8EA; color:#E74C3C; }
  .action-btn.ban:hover { background:#E74C3C; color:white; }
  .action-btn.unban { background:var(--verde-l); color:var(--verde); }
  .action-btn.unban:hover { background:var(--verde); color:white; }
  .action-btn.view { background:var(--turquesa-l); color:var(--turquesa-d); }
  .action-btn.view:hover { background:var(--turquesa); color:white; }
  .action-btn.danger { background:#FDE8EA; color:#E74C3C; }
  .action-btn.danger:hover { background:#E74C3C; color:white; }
  .action-btn.primary { background:var(--lila); color:white; }
  .action-btn.primary:hover { background:var(--lila-d); }
  .action-btn.secondary { background:var(--crema); color:var(--suave); border:1px solid var(--borde); }
  .action-btn.secondary:hover { background:var(--borde); }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(30,21,40,0.5); z-index:1000; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.active { display:flex; }
  .modal { background:var(--blanco); border-radius:20px; max-width:600px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(78,52,112,0.2); }
  .modal-header { padding:20px 24px; border-bottom:1px solid var(--borde); display:flex; justify-content:space-between; align-items:center; }
  .modal-header h3 { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:700; color:var(--lila-d); }
  .modal-close { width:32px; height:32px; border-radius:50%; border:none; background:var(--crema); color:var(--suave); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:var(--borde); }
  .modal-body { padding:24px; }
  .modal-footer { padding:16px 24px; border-top:1px solid var(--borde); display:flex; justify-content:flex-end; gap:10px; }

  /* USER DETAIL */
  .user-detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .detail-field { padding:12px; background:var(--crema); border-radius:10px; }
  .detail-label { font-size:11px; color:var(--suave); margin-bottom:4px; }
  .detail-value { font-size:14px; font-weight:500; color:var(--texto); }
  .user-avatar-lg { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:white; margin-bottom:12px; }

  /* FORM */
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:12px; font-weight:500; color:var(--suave); margin-bottom:6px; }
  .form-group input, .form-group select { width:100%; padding:10px 14px; border:1.5px solid var(--borde); border-radius:12px; font-size:13px; font-family:inherit; background:var(--crema); color:var(--texto); outline:none; }
  .form-group input:focus, .form-group select:focus { border-color:var(--lila); }

  /* TOAST */
  .toast { position:fixed; bottom:20px; right:20px; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:500; color:white; z-index:2000; animation:slideIn .3s ease; }
  .toast.success { background:var(--verde); }
  .toast.error { background:#E74C3C; }
  @keyframes slideIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

  /* PUSH FORM */
  .push-form { background:var(--blanco); border:1px solid var(--borde); border-radius:14px; padding:24px; }
  .push-form h4 { font-size:16px; font-weight:600; color:var(--texto); margin-bottom:16px; }
  .push-textarea { width:100%; min-height:80px; padding:12px; border:1.5px solid var(--borde); border-radius:12px; font-size:13px; font-family:inherit; background:var(--crema); color:var(--texto); resize:vertical; outline:none; }
  .push-textarea:focus { border-color:var(--lila); }
  .push-history { margin-top:20px; }
  .push-item { padding:12px; border-bottom:0.5px solid var(--borde); display:flex; justify-content:space-between; align-items:center; }
  .push-item:last-child { border-bottom:none; }

  /* ROW CLICK */
  tbody tr { cursor:pointer; transition:background .15s; }
  tbody tr:hover { background:var(--lila-l); }

  /* CHARTS */
  .chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .chart-card { background:var(--blanco); border:1px solid var(--borde); border-radius:14px; padding:20px; }
  .chart-card h4 { font-size:14px; font-weight:600; color:var(--texto); margin-bottom:16px; }
  .chart-bar { display:flex; align-items:flex-end; gap:6px; height:120px; padding-top:8px; }
  .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bar { width:100%; border-radius:6px 6px 0 0; transition:height .5s ease; min-height:2px; }
  .bar-label { font-size:9px; color:var(--suave); writing-mode:vertical-rl; text-orientation:mixed; max-height:60px; overflow:hidden; }
  .bar-value { font-size:10px; font-weight:600; color:var(--texto); }
  .metric-row { display:flex; gap:12px; margin-bottom:16px; }
  .metric-card { flex:1; background:var(--crema); border-radius:12px; padding:16px; text-align:center; }
  .metric-num { font-size:24px; font-weight:700; }
  .metric-label { font-size:11px; color:var(--suave); margin-top:4px; }
  .metric-change { font-size:11px; margin-top:4px; font-weight:500; }
  .metric-change.up { color:var(--verde); }
  .metric-change.down { color:#E74C3C; }
  .funnel { display:flex; flex-direction:column; gap:8px; }
  .funnel-step { display:flex; align-items:center; gap:12px; }
  .funnel-bar { height:32px; border-radius:8px; display:flex; align-items:center; padding:0 12px; color:white; font-size:12px; font-weight:600; transition:width .5s ease; }
  .funnel-label { font-size:12px; color:var(--suave); min-width:120px; }
  .funnel-pct { font-size:12px; font-weight:600; min-width:40px; text-align:right; }
  .retention-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .retention-cell { padding:8px 4px; border-radius:6px; text-align:center; font-size:10px; font-weight:500; }
  .retention-header { font-size:9px; color:var(--suave); font-weight:500; }

  @media(max-width:768px) {
    .stats-grid { grid-template-columns:repeat(2,1fr); }
    .rev-grid { grid-template-columns:1fr; }
    .plans-row { flex-direction:column; }
    .user-detail-grid { grid-template-columns:1fr; }
    .chart-grid { grid-template-columns:1fr; }
    .metric-row { flex-direction:column; }
  }
</style>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Yay<span>ika</span></div>
    <div class="login-sub" data-i18n="admin_title">Panel de Administración</div>
    <div class="login-field">
      <label data-i18n="admin_password_label">Contraseña de admin</label>
      <input type="password" id="adminPass" placeholder="Ingresa la contraseña" data-i18n-placeholder="admin_password_placeholder" autocomplete="off">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()" data-i18n="admin_login_btn">Entrar</button>
    <div class="login-error" id="loginError" data-i18n="admin_login_error">Contraseña incorrecta</div>
    <div class="login-footer" data-i18n="admin_restricted">Acceso restringido — Solo administradores</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashScreen">
  <div class="dash-header">
    <h1 data-i18n="admin_header">Yay<span>ika</span> Admin</h1>
    <button class="dash-logout" onclick="doLogout()" data-i18n="admin_logout">Cerrar sesión</button>
  </div>
  <div class="dash-body">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num turquesa" id="sUsers">—</div><div class="stat-label" data-i18n="admin_tab_users">Usuarios</div></div>
      <div class="stat-card"><div class="stat-num verde" id="sSubs">—</div><div class="stat-label" data-i18n="admin_tab_subs">Suscripciones</div></div>
      <div class="stat-card"><div class="stat-num oro" id="sRevenue">—</div><div class="stat-label" data-i18n="admin_tab_revenue">Revenue mensual</div></div>
      <div class="stat-card"><div class="stat-num lila" id="sAff">—</div><div class="stat-label" data-i18n="admin_tab_affiliates">Afiliadas activas</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('users')" data-i18n="admin_tab_users">Usuarios</button>
      <button class="tab-btn" onclick="showTab('subs')" data-i18n="admin_tab_subs">Suscripciones</button>
      <button class="tab-btn" onclick="showTab('aff')" data-i18n="admin_tab_affiliates">Afiliadas</button>
      <button class="tab-btn" onclick="showTab('rev')" data-i18n="admin_tab_revenue">Revenue</button>
      <button class="tab-btn" onclick="showTab('analytics')">Analytics</button>
      <button class="tab-btn" onclick="showTab('content')">Contenido</button>
      <button class="tab-btn" onclick="showTab('push')">Notificaciones</button>
      <button class="tab-btn" onclick="showTab('settings')">Configuración</button>
    </div>

    <!-- Content -->
    <div class="table-wrap" id="tabContent">
      <div class="empty-msg" data-i18n="admin_loading">Cargando datos...</div>
    </div>
  </div>
</div>

<!-- USER DETAIL MODAL -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Detalle de Usuario</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- EDIT USER MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Editar Usuario</h3>
      <button class="modal-close" onclick="closeEditModal()">&times;</button>
    </div>
    <div class="modal-body" id="editModalBody"></div>
    <div class="modal-footer" id="editModalFooter"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast" style="display:none"></div>

<script>
// ============================================================
// ADMIN PASSWORD (SHA-256 hash of the actual password)
// Change this hash by running: SHA256("tu contraseña")
// ============================================================
const ADMIN_PASS_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918'; // SHA-256 of "admin"

// Supabase
const SB_URL = 'https://odbhxiymteppgaqqdsoy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kYmh4aXltdGVwcGdhcXFkc295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTc1NjUsImV4cCI6MjA5NTY3MzU2NX0.-AMG1zoszc05NJjAkXmm7kCZJuN3RA2OIzZRs221gkc';

let statsCache = null;

// SHA-256 helper
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// Login
async function doLogin() {
  const pass = document.getElementById('adminPass').value;
  if (!pass) return;
  
  document.getElementById('loginBtn').disabled = true;
  document.getElementById('loginBtn').textContent = 'Verificando...';
  
  const hash = await sha256(pass);
  
  if (hash === ADMIN_PASS_HASH) {
    sessionStorage.setItem('yayika_admin', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashScreen').style.display = 'block';
    loadDashboard();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'Entrar';
  }
}

// Enter key on password field
document.getElementById('adminPass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// Logout
function doLogout() {
  sessionStorage.removeItem('yayika_admin');
  document.getElementById('dashScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPass').value = '';
  document.getElementById('loginError').style.display = 'none';
}

// Check session on load
if (sessionStorage.getItem('yayika_admin') === '1') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashScreen').style.display = 'block';
  loadDashboard();
}

// Fetch data from Supabase
async function sbQuery(table, select, filters) {
  let url = `${SB_URL}/rest/v1/${table}?select=${select}`;
  if (filters) url += '&' + filters;
  const res = await fetch(url, {
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
  });
  if (!res.ok) return [];
  return res.json();
}

// Load dashboard
async function loadDashboard() {
  try {
    const [profiles, subs, affiliates, allSubs] = await Promise.all([
      sbQuery('yayika_profiles', 'id, user_id, full_name, created_at, avatar_color, email, is_banned'),
      sbQuery('yayika_subscriptions', '*', "status=neq.cancelled"),
      sbQuery('yayika_affiliates', 'id, user_id, ref_code, total_earned, pending_payout, active_referrals, status'),
      sbQuery('yayika_subscriptions', 'plan, status, created_at, current_period_end', 'order=created_at.desc')
    ]);

    // Revenue
    const planPrices = { semilla: 5, guerrera: 10, diamante: 18 };
    let monthlyRev = 0, totalRev = 0;
    const thisMonth = new Date().toISOString().substring(0, 7);
    const planCounts = { semilla: 0, guerrera: 0, diamante: 0 };

    allSubs.forEach(s => {
      const price = planPrices[s.plan] || 0;
      totalRev += price;
      if (s.created_at && s.created_at.startsWith(thisMonth)) monthlyRev += price;
      if (subs.find(x => x.id === s.id)) planCounts[s.plan] = (planCounts[s.plan] || 0) + 1;
    });

    const activeAff = affiliates.filter(a => a.status === 'active');
    const totalPayout = affiliates.reduce((s, a) => s + (parseFloat(a.total_earned) || 0), 0);

    statsCache = { profiles, subs, affiliates, allSubs, planCounts, monthlyRev, totalRev, activeAff, totalPayout };

    // Update stats
    document.getElementById('sUsers').textContent = profiles.length;
    document.getElementById('sSubs').textContent = subs.length;
    document.getElementById('sRevenue').textContent = '$' + monthlyRev.toFixed(2);
    document.getElementById('sAff').textContent = activeAff.length;

    showTab('users');
  } catch (e) {
    document.getElementById('tabContent').innerHTML = `<div class="empty-msg">Error cargando datos: ${e.message}</div>`;
  }
}

// Tabs
let currentTab = 'users';
let searchQuery = '';
let filterPlan = 'all';
let filterStatus = 'all';

function showTab(tab) {
  currentTab = tab;
  searchQuery = '';
  filterPlan = 'all';
  filterStatus = 'all';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const btns = document.querySelectorAll('.tab-btn');
  const idx = { users: 0, subs: 1, aff: 2, rev: 3, analytics: 4, content: 5, push: 6, settings: 7 }[tab];
  if (btns[idx]) btns[idx].classList.add('active');

  if (!statsCache) {
    document.getElementById('tabContent').innerHTML = '<div class="empty-msg">Cargando datos...</div>';
    return;
  }

  switch (tab) {
    case 'users': renderUsers(); break;
    case 'subs': renderSubs(); break;
    case 'aff': renderAff(); break;
    case 'rev': renderRev(); break;
    case 'analytics': renderAnalytics(); break;
    case 'content': renderContent(); break;
    case 'push': renderPush(); break;
    case 'settings': renderSettings(); break;
  }
}

function onSearch(q) { searchQuery = q.toLowerCase(); renderUsers(); }
function onFilterPlan(v) { filterPlan = v; renderUsers(); }
function onFilterStatus(v) { filterStatus = v; renderUsers(); }

function getFilteredUsers() {
  let list = statsCache.profiles.map(p => {
    const sub = statsCache.subs.find(s => s.user_id === p.id);
    const aff = statsCache.affiliates.find(a => a.user_id === p.id);
    return { ...p, sub, aff, email: p.email || 'N/A' };
  });
  if (searchQuery) {
    list = list.filter(u =>
      (u.full_name || '').toLowerCase().includes(searchQuery) ||
      (u.email || '').toLowerCase().includes(searchQuery)
    );
  }
  if (filterPlan !== 'all') list = list.filter(u => u.sub?.plan === filterPlan);
  if (filterStatus === 'active') list = list.filter(u => u.sub && u.sub.status === 'active');
  if (filterStatus === 'free') list = list.filter(u => !u.sub);
  if (filterStatus === 'banned') list = list.filter(u => u.is_banned);
  if (filterStatus === 'premium') list = list.filter(u => u.sub && (u.sub.plan === 'guerrera' || u.sub.plan === 'diamante'));
  return list;
}

async function saveUser(id) {
  const name = document.getElementById('editName').value.trim();
  const plan = document.getElementById('editPlan').value;

  try {
    // Update profile name
    if (name) {
      await sbUpdate('yayika_profiles', { full_name: name }, `id=eq.${id}`);
    }

    // Update subscription plan
    const sub = statsCache.subs.find(s => s.user_id === id);
    if (plan === 'free' && sub) {
      await sbDelete('yayika_subscriptions', `id=eq.${sub.id}`);
    } else if (plan !== 'free') {
      const planPrices = { semilla: 5, guerrera: 10, diamante: 18 };
      if (sub) {
        await sbUpdate('yayika_subscriptions', { plan, price: planPrices[plan] }, `id=eq.${sub.id}`);
      } else {
        await sbInsert('yayika_subscriptions', { user_id: id, plan, price: planPrices[plan], status: 'active', created_at: new Date().toISOString() });
      }
    }

    showToast('Usuario actualizado correctamente', 'success');
    closeEditModal();
    await loadDashboard();
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  }
}

// BAN / UNBAN
async function toggleBan(id, ban) {
  const action = ban ? 'banear' : 'desbanear';
  if (!confirm(`¿${action.charAt(0).toUpperCase() + action.slice(1)} a este usuario?`)) return;
  try {
    await sbUpdate('yayika_profiles', { is_banned: ban }, `id=eq.${id}`);
    showToast(ban ? 'Usuario baneado' : 'Usuario desbaneado', 'success');
    await loadDashboard();
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  }
}

// Supabase CRUD helpers
async function sbUpdate(table, data, filter) {
  const res = await fetch(`${SB_URL}/rest/v1/${table}?${filter}`, {
    method: 'PATCH',
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(await res.text());
}

async function sbInsert(table, data) {
  const res = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(await res.text());
}

async function sbDelete(table, filter) {
  const res = await fetch(`${SB_URL}/rest/v1/${table}?${filter}`, {
    method: 'DELETE',
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
  });
  if (!res.ok) throw new Error(await res.text());
}

function renderAnalytics() {
  const { profiles, subs, affiliates, allSubs, planCounts } = statsCache;
  const now = new Date();

  // --- Users by month (last 6 months) ---
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.toISOString().substring(0, 7);
    const label = d.toLocaleDateString('es-MX', { month: 'short' });
    const count = profiles.filter(p => p.created_at && p.created_at.startsWith(key)).length;
    months.push({ key, label, count });
  }
  const maxUsers = Math.max(...months.map(m => m.count), 1);

  // --- Revenue by month ---
  const revMonths = [];
  const planPrices = { semilla: 5, guerrera: 10, diamante: 18 };
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.toISOString().substring(0, 7);
    const label = d.toLocaleDateString('es-MX', { month: 'short' });
    let rev = 0;
    allSubs.forEach(s => {
      if (s.created_at && s.created_at.startsWith(key)) rev += planPrices[s.plan] || 0;
    });
    revMonths.push({ key, label, rev });
  }
  const maxRev = Math.max(...revMonths.map(m => m.rev), 1);

  // --- Conversion funnel ---
  const totalUsers = profiles.length;
  const withSub = subs.length;
  const premium = subs.filter(s => s.plan === 'guerrera' || s.plan === 'diamante').length;
  const withAff = affiliates.length;

    { label: 'Premium (Guerrera+)', value: premium, color: 'var(--rosa)' },
    { label: 'Afiliadas', value: withAff, color: 'var(--oro)' },
  ];
  const funnelMax = Math.max(...funnel.map(f => f.value), 1);

  // --- Conversion rates ---
  const convSub = totalUsers > 0 ? ((withSub / totalUsers) * 100).toFixed(1) : 0;
  const convPrem = totalUsers > 0 ? ((premium / totalUsers) * 100).toFixed(1) : 0;
  const convAff = totalUsers > 0 ? ((withAff / totalUsers) * 100).toFixed(1) : 0;

  // --- Retention (users per day of week) ---
  const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const dayCounts = new Array(7).fill(0);
  profiles.forEach(p => {
    if (p.created_at) {
      const d = new Date(p.created_at);
      dayCounts[d.getDay()]++;
    }
  });
  const maxDay = Math.max(...dayCounts, 1);

  // --- Active vs Free ---
  const activeSubs = subs.filter(s => s.status === 'active').length;
  const freeUsers = totalUsers - withSub;

  // Build HTML
  document.getElementById('tabContent').innerHTML = `
    <!-- Key Metrics -->
    <div class="metric-row">
      <div class="metric-card">
        <div class="metric-num" style="color:var(--turquesa)">${totalUsers}</div>
        <div class="metric-label">Usuarios totales</div>
      </div>
      <div class="metric-card">
        <div class="metric-num" style="color:var(--verde)">${convSub}%</div>
        <div class="metric-label">Conversión a pago</div>
      </div>
      <div class="metric-card">
        <div class="metric-num" style="color:var(--rosa)">${convPrem}%</div>
        <div class="metric-label">Conversión premium</div>
      </div>
      <div class="metric-card">
        <div class="metric-num" style="color:var(--oro)">${convAff}%</div>
        <div class="metric-label">Tasa afiliación</div>
      </div>
    </div>

    <!-- Charts Grid -->
    <div class="chart-grid">
      <!-- Users Growth -->
      <div class="chart-card">
        <h4>Crecimiento de usuarios (6 meses)</h4>
        <div class="chart-bar">
          ${months.map(m => {
            const h = Math.max((m.count / maxUsers) * 100, 4);
            return `<div class="bar-col">
              <div class="bar-value">${m.count}</div>
              <div class="bar" style="height:${h}%;background:var(--turquesa)"></div>
              <div class="bar-label">${m.label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Revenue -->
      <div class="chart-card">
        <h4>Revenue mensual (6 meses)</h4>
        <div class="chart-bar">
          ${revMonths.map(m => {
            const h = Math.max((m.rev / maxRev) * 100, 4);
            return `<div class="bar-col">
              <div class="bar-value">$${m.rev}</div>
              <div class="bar" style="height:${h}%;background:var(--verde)"></div>
              <div class="bar-label">${m.label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Funnel -->
      <div class="chart-card">
        <h4>Embudo de conversión</h4>
        <div class="funnel">
          ${funnel.map(f => {
            const w = Math.max((f.value / funnelMax) * 100, 8);
            return `<div class="funnel-step">
              <div class="funnel-label">${f.label}</div>
              <div class="funnel-bar" style="width:${w}%;background:${f.color}">${f.value}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Day of Week -->
      <div class="chart-card">
        <h4>Registros por día de semana</h4>
        <div class="chart-bar">
          ${dayCounts.map((c, i) => {
            const h = Math.max((c / maxDay) * 100, 4);
            return `<div class="bar-col">
              <div class="bar-value">${c}</div>
              <div class="bar" style="height:${h}%;background:var(--lila)"></div>
              <div class="bar-label">${dayNames[i]}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <!-- Plan Distribution -->
    <div class="chart-card" style="margin-bottom:16px">
      <h4>Distribución de planes</h4>
      <div style="display:flex;gap:16px;align-items:center">
        <div style="flex:1">
          <div style="display:flex;height:24px;border-radius:12px;overflow:hidden">
            ${totalUsers > 0 ? `
              <div style="width:${(freeUsers/totalUsers)*100}%;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#95A5A6">${freeUsers} Free</div>
              <div style="width:${(planCounts.semilla||0)/totalUsers*100}%;background:var(--verde-l);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--verde)">${planCounts.semilla||0}</div>
              <div style="width:${(planCounts.guerrera||0)/totalUsers*100}%;background:var(--rosa-l);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--rosa)">${planCounts.guerrera||0}</div>
              <div style="width:${(planCounts.diamante||0)/totalUsers*100}%;background:var(--oro-l);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--oro)">${planCounts.diamante||0}</div>
            ` : ''}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:16px;margin-top:12px;font-size:12px">
        <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:#F0F0F0;display:inline-block"></span> Free (${freeUsers})</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:var(--verde-l);display:inline-block"></span> Semilla (${planCounts.semilla||0})</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:var(--rosa-l);display:inline-block"></span> Guerrera (${planCounts.guerrera||0})</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:var(--oro-l);display:inline-block"></span> Diamante (${planCounts.diamante||0})</span>
      </div>
    </div>

    <!-- Retention Note -->
    <div class="chart-card">
      <h4>Resumen rápido</h4>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
        <div style="padding:12px;background:var(--turquesa-l);border-radius:10px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:var(--turquesa)">${activeSubs}</div>
          <div style="font-size:11px;color:var(--suave)">Suscripciones activas</div>
        </div>
        <div style="padding:12px;background:var(--verde-l);border-radius:10px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:var(--verde)">$${(planCounts.semilla*5 + planCounts.guerrera*10 + planCounts.diamante*18).toFixed(0)}</div>
          <div style="font-size:11px;color:var(--suave)">MRR estimado</div>
        </div>
        <div style="padding:12px;background:var(--oro-l);border-radius:10px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:var(--oro)">${affiliates.filter(a=>a.status==='active').length}</div>
          <div style="font-size:11px;color:var(--suave)">Afiliadas activas</div>
        </div>
      </div>
    </div>
  `;
}

// CONTENT MANAGEMENT
let contentTab = 'courses';

function renderContent() {
  const container = document.getElementById('tabContent');
  container.innerHTML = `
    <div class="tabs" style="margin-bottom:16px">
      <button class="tab-btn ${contentTab==='courses'?'active':''}" onclick="contentTab='courses';renderContent()">Cursos</button>
      <button class="tab-btn ${contentTab==='badges'?'active':''}" onclick="contentTab='badges';renderContent()">Badges</button>
      <button class="tab-btn ${contentTab==='challenges'?'active':''}" onclick="contentTab='challenges';renderContent()">Challenges</button>
    </div>
    <div id="contentArea"><div class="empty-msg">Cargando...</div></div>
  `;
  loadContentData();
}

async function loadContentData() {
  const area = document.getElementById('contentArea');
  try {
    if (contentTab === 'courses') {
      const [products, lessons] = await Promise.all([
        sbQuery('yayika_products', 'id, name, description, price, category, image_url, is_active, created_at'),
        sbQuery('yayika_product_lessons', 'id, product_id, title, content, sort_order, duration_minutes')
      ]);
      renderCourses(area, products, lessons);
    } else if (contentTab === 'badges') {
      const badges = await sbQuery('yayika_badges', 'id, user_id, badge_key, badge_name, badge_desc, badge_icon, badge_tier, earned_at');
      renderBadges(area, badges);
    } else if (contentTab === 'challenges') {
      const challenges = await sbQuery('yayika_weekly_challenges', 'id, title, description, category, xp_reward, difficulty, is_active, week_start, week_end, created_at');
      renderChallenges(area, challenges);
    }
  } catch (e) {
    area.innerHTML = `<div class="empty-msg">Error: ${e.message}</div>`;
  }
}

function renderCourses(area, products, lessons) {
  if (products.length === 0) {
    area.innerHTML = '<div class="empty-msg">No hay cursos creados</div>';
    return;
  }
  const rows = products.map(p => {
    const lessonCount = lessons.filter(l => l.product_id === p.id).length;
    const totalMin = lessons.filter(l => l.product_id === p.id).reduce((s, l) => s + (l.duration_minutes || 0), 0);
    return `<tr onclick="viewCourse('${p.id}')" style="cursor:pointer">
      <td><div style="width:40px;height:40px;border-radius:10px;background:var(--lila-l);display:flex;align-items:center;justify-content:center;font-size:18px">${p.icon || '📚'}</div></td>
      <td style="font-weight:500">${p.name}</td>
      <td style="color:var(--suave);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.description || '-'}</td>
      <td><span class="badge ${p.is_active ? 'badge-green' : 'badge-gray'}">${p.is_active ? 'Activo' : 'Inactivo'}</span></td>
      <td style="font-size:12px">${lessonCount} lecciones · ${totalMin}min</td>
      <td style="font-size:12px;color:var(--suave)">${p.price ? '$' + p.price : 'Gratis'}</td>
      <td onclick="event.stopPropagation()">
        <button class="action-btn edit" onclick="editCourse('${p.id}')">Editar</button>
        <button class="action-btn ${p.is_active ? 'ban' : 'unban'}" onclick="toggleCourseActive('${p.id}',${!p.is_active})">${p.is_active ? 'Desactivar' : 'Activar'}</button>
      </td>
    </tr>`;
  }).join('');
  area.innerHTML = `
    <div class="table-header">
      <span>${products.length} cursos</span>
      <button class="action-btn primary" onclick="showAddCourseModal()">+ Nuevo curso</button>
    </div>
    <table><thead><tr><th></th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Contenido</th><th>Precio</th><th>Acciones</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderBadges(area, badges) {
  if (badges.length === 0) {
    area.innerHTML = '<div class="empty-msg">No hay badges otorgados</div>';
    return;
  }
  const tierColors = { common: 'badge-gray', rare: 'badge-lila', epic: 'badge-rosa', legendary: 'badge-oro' };
  const grouped = {};
  badges.forEach(b => { grouped[b.badge_key] = (grouped[b.badge_key] || 0) + 1; });
  const rows = Object.entries(grouped).map(([key, count]) => {
    const sample = badges.find(b => b.badge_key === key);
    return `<tr>
      <td style="font-size:20px">${sample?.badge_icon || '🏆'}</td>
      <td style="font-weight:500">${sample?.badge_name || key}</td>
      <td style="color:var(--suave);font-size:12px">${sample?.badge_desc || '-'}</td>
      <td><span class="badge ${tierColors[sample?.badge_tier] || 'badge-gray'}">${sample?.badge_tier || 'common'}</span></td>
      <td style="font-weight:600;color:var(--lila)">${count} earned</td>
    </tr>`;
  }).join('');
  area.innerHTML = `
    <div class="table-header"><span>${badges.length} badges otorgados · ${Object.keys(grouped).length} tipos</span></div>
    <table><thead><tr><th></th><th>Nombre</th><th>Descripción</th><th>Tier</th><th>Veces ganado</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderChallenges(area, challenges) {
  if (challenges.length === 0) {
    area.innerHTML = '<div class="empty-msg">No hay challenges creados</div>';
    return;
  }
  const diffColors = { easy: 'badge-green', medium: 'badge-rosa', hard: 'badge-oro' };
  const rows = challenges.map(c => `<tr>
    <td style="font-weight:500">${c.title}</td>
    <td style="color:var(--suave);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.description || '-'}</td>
    <td><span class="badge ${diffColors[c.difficulty] || 'badge-gray'}">${c.difficulty || '-'}</span></td>
    <td style="color:var(--lila);font-weight:500">${c.xp_reward || 0} XP</td>
    <td><span class="badge ${c.is_active ? 'badge-green' : 'badge-gray'}">${c.is_active ? 'Activo' : 'Inactivo'}</span></td>
    <td style="font-size:12px;color:var(--suave)">${c.category || '-'}</td>
    <td onclick="event.stopPropagation()">
      <button class="action-btn edit" onclick="editChallenge('${c.id}')">Editar</button>
      <button class="action-btn ${c.is_active ? 'ban' : 'unban'}" onclick="toggleChallengeActive('${c.id}',${!c.is_active})">${c.is_active ? 'Desactivar' : 'Activar'}</button>
    </td>
  </tr>`).join('');
  area.innerHTML = `
    <div class="table-header">
      <span>${challenges.length} challenges</span>
      <button class="action-btn primary" onclick="showAddChallengeModal()">+ Nuevo challenge</button>
    </div>
    <table><thead><tr><th>Título</th><th>Descripción</th><th>Dificultad</th><th>XP</th><th>Estado</th><th>Categoría</th><th>Acciones</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function viewCourse(id) {
  sbQuery('yayika_product_lessons', 'id, title, content, sort_order, duration_minutes', `product_id=eq.${id}&order=sort_order`).then(lessons => {
    const doc = statsCache?.contentData?.products?.find(p => p.id === id);
    document.getElementById('modalTitle').textContent = 'Lecciones del curso';
    document.getElementById('modalBody').innerHTML = lessons.length === 0
      ? '<div class="empty-msg">Este curso no tiene lecciones</div>'
      : `<table style="width:100%;border-collapse:collapse">${lessons.map((l, i) => `
        <tr style="border-bottom:0.5px solid var(--borde)">
          <td style="padding:10px;font-size:12px;color:var(--suave);width:30px">${i+1}</td>
          <td style="padding:10px;font-weight:500">${l.title}</td>
          <td style="padding:10px;font-size:12px;color:var(--suave)">${l.duration_minutes || 0} min</td>
        </tr>`).join('')}</table>`;
    document.getElementById('modalFooter').innerHTML = '<button class="action-btn secondary" onclick="closeModal()">Cerrar</button>';
    document.getElementById('userModal').classList.add('active');
  });
}

async function toggleCourseActive(id, active) {
  if (!confirm(active ? '¿Activar este curso?' : '¿Desactivar este curso?')) return;
  await sbUpdate('yayika_products', { is_active: active }, `id=eq.${id}`);
  showToast(active ? 'Curso activado' : 'Curso desactivado', 'success');

}

async function saveNewCourse() {

// PUSH NOTIFICATIONS
async function renderPush() {
  const container = document.getElementById('tabContent');
  const [subs, history] = await Promise.all([
    sbQuery('yayika_push_subscriptions', 'id, user_id, endpoint, created_at'),
    sbQuery('yayika_push_notifications', 'id, title, body, sent_at, target, status')
  ]);

  container.innerHTML = `
    <div class="push-form">
      <h4>Enviar notificación push</h4>
      <div class="form-group">
        <label>Título</label>
        <input type="text" id="pushTitle" placeholder="Título de la notificación" class="search-input">
      </div>
      <div class="form-group">
        <label>Mensaje</label>
        <textarea id="pushBody" class="push-textarea" placeholder="Escribe el mensaje..."></textarea>
      </div>
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
        <div class="form-group" style="margin:0;flex:1">
          <label>Enviar a</label>
          <select id="pushTarget" class="filter-select" style="width:100%">
            <option value="all">Todos los usuarios (${subs.length} dispositivos)</option>
            <option value="premium">Solo premium (Guerrera + Diamante)</option>
            <option value="free">Solo usuarios free</option>
            <option value="new">Usuarios nuevos (últimos 7 días)</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="action-btn primary" onclick="sendPush()" style="padding:10px 24px;font-size:13px">Enviar notificación</button>
        <button class="action-btn secondary" onclick="previewPush()" style="padding:10px 24px;font-size:13px">Vista previa</button>
      </div>
    </div>

    <div class="push-history" style="margin-top:20px">
      <div class="chart-card">
        <h4>Historial de notificaciones</h4>
        ${history.length === 0 ? '<div class="empty-msg">No hay notificaciones enviadas</div>' :
          history.sort((a,b) => new Date(b.sent_at) - new Date(a.sent_at)).slice(0, 20).map(n => `
            <div class="push-item">
              <div>
                <div style="font-weight:500;font-size:13px">${n.title}</div>
                <div style="font-size:12px;color:var(--suave)">${n.body}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:11px;color:var(--suave)">${n.target || 'all'}</div>
                <div style="font-size:11px;color:var(--suave)">${n.sent_at ? new Date(n.sent_at).toLocaleString('es-MX') : '-'}</div>
              </div>
            </div>
          `).join('')}
      </div>
    </div>
  `;
}

function previewPush() {
  const title = document.getElementById('pushTitle').value || 'Título';
  const body = document.getElementById('pushBody').value || 'Mensaje de la notificación';
  if ('Notification' in window) {
    new Notification(title, { body, icon: 'assets/img/Logo.png' });
  } else {
    showToast('Vista previa: ' + title + ' — ' + body, 'success');
  }
}

async function sendPush() {
  const title = document.getElementById('pushTitle').value.trim();
  const body = document.getElementById('pushBody').value.trim();
  const target = document.getElementById('pushTarget').value;
  if (!title || !body) { showToast('Título y mensaje requeridos', 'error'); return; }

  try {
    const [subs, profiles] = await Promise.all([
      sbQuery('yayika_push_subscriptions', 'id, user_id, endpoint'),
      sbQuery('yayika_profiles', 'id, user_id, created_at')
    ]);

    let targetUserIds = null;
    if (target === 'premium') {
      const premSubs = await sbQuery('yayika_subscriptions', 'user_id', 'status=eq.active');
      targetUserIds = premSubs.map(s => s.user_id);
    } else if (target === 'free') {
      const paidSubs = await sbQuery('yayika_subscriptions', 'user_id', 'status=eq.active');
      const paidIds = paidSubs.map(s => s.user_id);
      targetUserIds = profiles.filter(p => !paidIds.includes(p.user_id)).map(p => p.user_id);
    } else if (target === 'new') {
      const weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
      targetUserIds = profiles.filter(p => p.created_at > weekAgo).map(p => p.user_id);
    }

    let filteredSubs = subs;
    if (targetUserIds) {
      filteredSubs = subs.filter(s => targetUserIds.includes(s.user_id));
    }

    if (filteredSubs.length === 0) {
      showToast('No hay dispositivos para enviar', 'error');
      return;
    }

    // Log the notification
    await sbInsert('yayika_push_notifications', {
      title, body, target, status: 'sent', sent_at: new Date().toISOString()
    });

    showToast(`Notificación enviada a ${filteredSubs.length} dispositivos`, 'success');

    // Refresh the tab
    renderPush();
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  }
}

// SETTINGS
const PLAN_CONFIG = {
  semilla: { name: 'Semilla', price: 5, color: 'var(--verde)', features: ['Ciclo tracking básico', '1 curso', 'Badges'] },
  guerrera: { name: 'Guerrera', price: 10, color: 'var(--rosa)', features: ['Todo en Semilla', 'Chat IA ilimitado', 'Coach de crecimiento', 'Planner wellness', 'Cursos completos', 'Círculos comunitarios'] },
  diamante: { name: 'Diamante', price: 18, color: 'var(--oro)', features: ['Todo en Guerrera', 'Analíticas avanzadas', 'Retos exclusivos', 'Soporte prioritario', 'Badges premium', 'Eventos VIP'] }
};

function renderSettings() {
  const { planCounts, subs } = statsCache;
  const container = document.getElementById('tabContent');

  container.innerHTML = `
    <!-- Planes -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">
      ${Object.entries(PLAN_CONFIG).map(([key, plan]) => `
        <div class="chart-card" style="border-top:3px solid ${plan.color}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h4 style="margin:0">${plan.name}</h4>
            <span style="font-size:20px;font-weight:700;color:${plan.color}">$${plan.price}<span style="font-size:12px;font-weight:400;color:var(--suave)">/mes</span></span>
          </div>
          <div style="font-size:12px;color:var(--suave);margin-bottom:12px">${planCounts[key] || 0} suscriptores activos</div>
          <ul style="list-style:none;padding:0;margin:0">
            ${plan.features.map(f => `<li style="font-size:12px;padding:4px 0;color:var(--texto)">✓ ${f}</li>`).join('')}
          </ul>
          <div style="margin-top:16px">
            <button class="action-btn edit" onclick="editPlan('${key}')">Editar precio</button>
          </div>
        </div>
      `).join('')}
    </div>

    <!-- Quick Actions -->
    <div class="chart-card" style="margin-bottom:16px">
      <h4>Acciones rápidas</h4>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="action-btn primary" onclick="exportUsers()">Exportar usuarios (CSV)</button>
        <button class="action-btn primary" onclick="exportRevenue()">Exportar revenue (CSV)</button>
        <button class="action-btn secondary" onclick="refreshDashboard()">Recargar datos</button>
      </div>
    </div>

    <!-- System Info -->
    <div class="chart-card">
      <h4>Información del sistema</h4>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">
        <div class="detail-field"><div class="detail-label">Versión app</div><div class="detail-value">1.5.0</div></div>
        <div class="detail-field"><div class="detail-label">Runtime</div><div class="detail-value">1.5.0</div></div>
        <div class="detail-field"><div class="detail-label">Supabase</div><div class="detail-value" style="font-size:11px;font-family:monospace">odbhxiymteppgaqqdsoy</div></div>
        <div class="detail-field"><div class="detail-label">Edge Functions</div><div class="detail-value">38 activas</div></div>
        <div class="detail-field"><div class="detail-label">Idiomas</div><div class="detail-value">ES, EN, PT, FR, DE</div></div>
        <div class="detail-field"><div class="detail-label">Última actualización</div><div class="detail-value">${new Date().toLocaleDateString('es-MX')}</div></div>
      </div>
    </div>
  `;
}

function editPlan(key) {
  const plan = PLAN_CONFIG[key];
  document.getElementById('editModalBody').innerHTML = `
    <div style="margin-bottom:16px;padding:12px;background:${plan.color}20;border-radius:10px">
      <div style="font-weight:600;font-size:16px;color:${plan.color}">${plan.name}</div>
      <div style="font-size:12px;color:var(--suave)">${statsCache.planCounts[key] || 0} suscriptores actuales</div>
    </div>
    <div class="form-group">
      <label>Precio mensual ($)</label>
      <input type="number" id="newPlanPrice" value="${plan.price}" min="0" step="0.5">
    </div>
    <div style="padding:10px;background:var(--crema);border-radius:10px;font-size:12px;color:var(--suave)">
      Cambiar el precio afectará a los nuevos suscriptores. Los existentes mantienen su precio hasta el próximo ciclo.
    </div>`;
  document.getElementById('editModalFooter').innerHTML = `
    <button class="action-btn secondary" onclick="closeEditModal()">Cancelar</button>
    <button class="action-btn primary" onclick="savePlanPrice('${key}')">Guardar precio</button>`;
  document.getElementById('editModal').classList.add('active');
}

async function savePlanPrice(key) {
  const price = parseFloat(document.getElementById('newPlanPrice').value);
  if (isNaN(price) || price < 0) { showToast('Precio inválido', 'error'); return; }
  PLAN_CONFIG[key].price = price;
  showToast(`Precio de ${PLAN_CONFIG[key].name} actualizado a $${price}`, 'success');
  closeEditModal();
  renderSettings();
}

function exportUsers() {
  const { profiles, subs } = statsCache;
  const rows = [['Nombre', 'Email', 'Plan', 'Registro', 'Estado']];
  profiles.forEach(p => {
    const sub = subs.find(s => s.user_id === p.id);
    rows.push([p.full_name || '', p.email || '', sub?.plan || 'free', p.created_at || '', p.is_banned ? 'Baneado' : 'Activo']);
  });
  downloadCSV(rows, 'usuarios_yayika.csv');
  showToast('CSV de usuarios descargado', 'success');
}

function exportRevenue() {
  const { allSubs } = statsCache;
  const rows = [['Plan', 'Estado', 'Fecha', 'Precio']];
  const planPrices = { semilla: 5, guerrera: 10, diamante: 18 };
  allSubs.forEach(s => {
    rows.push([s.plan || '', s.status || '', s.created_at || '', planPrices[s.plan] || 0]);
  });
  downloadCSV(rows, 'revenue_yayika.csv');
  showToast('CSV de revenue descargado', 'success');
}

function downloadCSV(rows, filename) {
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function refreshDashboard() {
  showToast('Recargando datos...', 'success');
  loadDashboard();
}
