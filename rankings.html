ttom:8px}.rankings-header p{color:var(--suave);font-size:0.95rem}/* PODIUM */.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:40px;padding:0 20px}.podium-place{text-align:center;flex:1;max-width:180px}.podium-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 8px;font-weight:700;color:white}.podium-place:nth-child(1) .podium-avatar{background:linear-gradient(135deg,#FFD700,#FFA000);width:80px;height:80px;font-size:2rem}.podium-place:nth-child(2) .podium-avatar{background:linear-gradient(135deg,#C0C0C0,#9E9E9E)}.podium-place:nth-child(3) .podium-avatar{background:linear-gradient(135deg,#CD7F32,#8B5A2B)}.podium-name{font-weight:600;font-size:0.9rem;margin-bottom:2px}.podium-xp{color:var(--oro);font-weight:600;font-size:0.85rem}.podium-badges{color:var(--suave);font-size:0.75rem}.podium-crown{font-size:1.5rem;margin-bottom:4px}/* TABS */.rank-tabs{display:flex;gap:8px;margin-bottom:24px;justify-content:center}.rank-tab{padding:10px 20px;border-radius:100px;border:1px solid var(--borde);background:var(--card);color:var(--suave);font-size:0.85rem;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}.rank-tab:hover{border-color:var(--lila);color:var(--lila)}.rank-tab.active{background:var(--lila-d);color:white;border-color:var(--lila-d)}[data-theme="dark"] .rank-tab.active{background:var(--lila);border-color:var(--lila)}/* LIST */.rank-list{display:flex;flex-direction:column;gap:8px}.rank-item{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--card);border:1px solid var(--borde);border-radius:12px;transition:background 0.2s}.rank-item:hover{background:var(--lila-l)}.rank-item.me{border-color:var(--lila);background:var(--lila-l)}.rank-pos{font-weight:700;font-size:1.1rem;color:var(--suave);width:32px;text-align:center}.rank-item:nth-child(1) .rank-pos{color:#FFD700}.rank-item:nth-child(2) .rank-pos{color:#C0C0C0}.rank-item:nth-child(3) .rank-pos{color:#CD7F32}.rank-avatar{width:40px;height:40px;border-radius:50%;background:var(--lila-l);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--lila-d);flex-shrink:0}.rank-info{flex:1}.rank-name{font-weight:600;font-size:0.95rem}.rank-level{color:var(--suave);font-size:0.8rem}.rank-stats{display:flex;gap:16px;align-items:center}.rank-stat{text-align:right}.rank-stat-val{font-weight:700;font-size:0.95rem}.rank-stat-label{font-size:0.7rem;color:var(--suave);text-transform:uppercase}/* EMPTY */.rank-empty{text-align:center;padding:40px;color:var(--suave)}/* LEVEL BADGE */.level-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:600;text-transform:uppercase}.level-standard{background:var(--lila-l);color:var(--lila)}.level-silver{background:#E0E0E0;color:#616161}.level-gold{background:var(--oro-l);color:var(--oro)}@media(max-width:600px){  .podium{flex-direction:column;align-items:center}  .podium-place{max-width:100%}  .rank-stats{flex-direction:column;gap:4px}}</style></head><body>
<a href="#main-content" class="skip-link">Saltar al contenido principal</a><div class="rankings-wrap" id="main-content">  <div class="rankings-header">    <h1 data-i18n="rankings_title">Mujeres que Brillan</h1>    <p data-i18n="rankings_sub">Las miembros m�s activas de la comunidad Yayika</p>  </div>  <!-- Podium -->  <div class="podium" id="podium"></div>  <!-- Tabs -->  <div class="rank-tabs">    <button class="rank-tab active" onclick="switchRankTab('xp')" data-i18n="rank_tab_xp">Top XP</button>    <button class="rank-tab" onclick="switchRankTab('badges')" data-i18n="rank_tab_badges">Top Badges</button>    <button class="rank-tab" onclick="switchRankTab('streaks')" data-i18n="rank_tab_streaks">Rachas</button>  </div>  <!-- List -->  <div class="rank-list" id="rankList">    <div class="rank-empty" id="rankEmpty">      <p data-i18n="rankings_empty">Los rankings se actualizar�n cuando empieces a usar Yayika. ��nete!</p>    </div>  </div></div><script src="js/i18n.js"></script><script>const RANK_SB_URL = 'https://odbhxiymteppgaqqdsoy.supabase.co';const RANK_SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kYmh4aXltdGVwcGdhcXFkc295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTc1NjUsImV4cCI6MjA5NTY3MzU2NX0.-AMG1zoszc05NJjAkXmm7kCZJuN3RA2OIzZRs221gkc';let rankSb = null;let currentTab = 'xp';let rankingsData = [];function rk(key) {  const f = {    rankings_title: 'Mujeres que Brillan',    rankings_sub: 'Las miembros m�s activas de la comunidad Yayika',    rank_tab_xp: 'Top XP',    rank_tab_badges: 'Top Badges',    rank_tab_streaks: 'Rachas',    rankings_empty: 'Los rankings se actualizar�n cuando empieces a usar Yayika. ��nete!',    rank_xp: 'XP',    rank_badges: 'Badges',    rank_streak: 'Racha'  };  try { if (typeof t === 'function') return t(key); } catch(e) {}  return f[key] || key;}function initRankings() {  if (window.supabase && window.supabase.createClient) {    rankSb = window.supabase.createClient(RANK_SB_URL, RANK_SB_KEY);  }  loadRankings();}async function loadRankings() {  // Use community rankings from Supabase  if (!rankSb) { renderDemoRankings(); return; }  try {    // Try to get rankings from profiles    const { data: profiles } = await rankSb      .from('yayika_profiles')      .select('id, full_name, email, avatar_url')      .limit(50);    if (!profiles || profiles.length === 0) { renderDemoRankings(); return; }    // Try to get XP data    const { data: onboarding } = await rankSb      .from('yayika_onboarding_progress')      .select('user_id, total_xp_earned')      .order('total_xp_earned', { ascending: false })      .limit(20);    // Try badges    const { data: badges } = await rankSb      .from('yayika_badges')      .select('user_id')      .limit(100);    // Merge data    rankingsData = profiles.map(p => {      const xp = onboarding?.find(o => o.user_id === p.id);      const userBadges = badges?.filter(b => b.user_id === p.id).length || 0;      return {        id: p.id,        name: p.full_name || (p.email ? p.email.split('@')[0] : 'Guerrera'),        avatar: p.avatar_url,        xp: xp?.total_xp_earned || 0,        badges: userBadges,        streak: 0      };    }).filter(p => p.xp > 0 || p.badges > 0);    if (rankingsData.length === 0) { renderDemoRankings(); return; }    renderRankings();  } catch (e) {    console.warn('[Rankings] Load failed, using demo data', e);    renderDemoRankings();  }}function renderDemoRankings() {  rankingsData = [    { id:'1', name:'Sof�a Luna', xp:2450, badges:12, streak:14 },    { id:'2', name:'Valentina R.', xp:2180, badges:10, streak:21 },    { id:'3', name:'Camila Torres', xp:1920, badges:8, streak:7 },    { id:'4', name:'Isabella M.', xp:1650, badges:9, streak:10 },    { id:'5', name:'Mariana Costa', xp:1480, badges:7, streak:5 },    { id:'6', name:'Ana Garc�a', xp:1320, badges:6, streak:12 },    { id:'7', name:'Luc�a Herrera', xp:1150, badges:5, streak:3 },    { id:'8', name:'Elena Ruiz', xp:980, badges:4, streak:8 },    { id:'9', name:'Paula D�az', xp:850, badges:3, streak:2 },    { id:'10', name:'Andrea L�pez', xp:720, badges:3, streak:6 }  ];  renderRankings();}function renderRankings() {  const list = document.getElementById('rankList');  const empty = document.getElementById('rankEmpty');  const podium = document.getElementById('podium');  if (rankingsData.length === 0) {    empty.style.display = 'block';    podium.innerHTML = '';    return;  }  empty.style.display = 'none';  // Sort by current tab  const sorted = [...rankingsData].sort((a, b) => {    if (currentTab === 'xp') return b.xp - a.xp;    if (currentTab === 'badges') return b.badges - a.badges;    return b.streak - a.streak;  });  // Podium (top 3)  const top3 = sorted.slice(0, 3);  const podiumOrder = [top3[1], top3[0], top3[2]].filter(Boolean); // 2nd, 1st, 3rd  podium.innerHTML = podiumOrder.map((p, i) => {    const pos = [2, 1, 3][i];    const initials = p.name.split(' ').map(n => n[0]).join('').substring(0, 2);    const crown = pos === 1 ? '<div class="podium-crown">??</div>' : '';    const val = currentTab === 'xp' ? `${p.xp.toLocaleString()} XP` :                currentTab === 'badges' ? `${p.badges} ${rk('rank_badges')}` : `${p.streak} ${rk('rank_streak')}`;    return `      <div class="podium-place">        ${crown}        <div class="podium-avatar">${initials}</div>        <div class="podium-name">${escR(p.name)}</div>        <div class="podium-xp">${val}</div>      </div>    `;  }).join('');  // Full list  list.innerHTML = sorted.map((p, i) => {    const initials = p.name.split(' ').map(n => n[0]).join('').substring(0, 2);    const val = currentTab === 'xp' ? `${p.xp.toLocaleString()}` :                currentTab === 'badges' ? `${p.badges}` : `${p.streak}`;    const label = currentTab === 'xp' ? rk('rank_xp') :                  currentTab === 'badges' ? rk('rank_badges') : rk('rank_streak');    return `      <div class="rank-item">        <div class="rank-pos">${i + 1}</div>        <div class="rank-avatar">${initials}</div>        <div class="rank-info">          <div class="rank-name">${escR(p.name)}</div>        </div>        <div class="rank-stats">          <div class="rank-stat">            <div class="rank-stat-val">${val}</div>            <div class="rank-stat-label">${label}</div>          </div>        </div>      </div>    `;  }).join('');}function switchRankTab(tab) {  currentTab = tab;  document.querySelectorAll('.rank-tab').forEach(b => b.classList.remove('active'));  document.querySelector(`.rank-tab[onclick*="${tab}"]`)?.classList.add('active');  renderRankings();}function escR(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }function toggleTheme() {  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';  document.documentElement.setAttribute('data-theme', next);  localStorage.setItem('yayika_theme', next);}document.addEventListener('DOMContentLoaded', () => {  const saved = localStorage.getItem('yayika_theme') || 'light';  document.documentElement.setAttribute('data-theme', saved);  initRankings();});</script>  <!-- Security -->
