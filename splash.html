<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yayika</title>
<meta name="theme-color" content="#4E3470">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:#4E3470;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;overflow:hidden}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;animation:fadeIn .6s ease}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:56px;font-weight:700;letter-spacing:-2px}
.logo span{color:#C96B7A}
.tagline{font-size:16px;opacity:.6;font-weight:300;letter-spacing:.5px}
.loader{width:40px;height:40px;border:3px solid rgba(255,255,255,.15);border-top-color:#C96B7A;border-radius:50%;animation:spin 1s linear infinite;margin-top:20px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
/* Safe area for notched phones */
@supports(padding:env(safe-area-inset-top)){
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
}
</style>
</head>
<body>
<div class="splash">
  <div class="logo">Yay<span>ika</span></div>
  <div class="tagline">Productos digitales para mujeres</div>
  <div class="loader"></div>
</div>
<script>
// Auto-redirect after splash (2 seconds max)
setTimeout(function(){
  window.location.replace('/');
}, 2000);
</script>
</body>
</html>
