<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña — Yayika</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #fdf2f8, #fce7f3, #f5d0fe);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-box {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      text-align: center;
    }
    .reset-logo {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .reset-title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .reset-desc {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-input:focus {
      border-color: #9333ea;
    }
    .btn-reset {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #9333ea, #ec4899);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-reset:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.4);
    }
    .btn-reset:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      color: #dc2626;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .success-msg {
      color: #16a34a;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }
    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #9333ea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .invalid-token {
      display: none;
      text-align: center;
      padding: 40px;
    }
    .invalid-token .icon { font-size: 48px; margin-bottom: 16px; }
    .invalid-token h2 { font-size: 20px; color: #1a1a2e; margin-bottom: 8px; }
    .invalid-token p { font-size: 14px; color: #666; margin-bottom: 20px; }
    .btn-back {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #9333ea, #ec4899);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .password-strength {
      height: 4px;
      border-radius: 2px;
      margin-top: 6px;
      transition: all 0.3s;
    }
  </style>
</head>
<body>
  <div class="reset-box">
    <!-- Loading state -->
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <p>Verificando enlace...</p>
    </div>
    
    <!-- Invalid token state -->
    <div class="invalid-token" id="invalidState">
      <div class="icon">🔒</div>
      <h2>Enlace no válido</h2>
      <p>El enlace de recuperación ha expirado o no es válido. Solicita uno nuevo.</p>
      <a href="Portales/index.html" class="btn-back">Volver al login</a>
    </div>
    
    <!-- Reset form -->
    <div id="resetForm" style="display:none">
      <div class="reset-logo">🎀</div>
      <h1 class="reset-title">Nueva contraseña</h1>
      <p class="reset-desc">Ingresa tu nueva contraseña para tu cuenta de Yayika.</p>
      
      <div class="form-group">
        <label class="form-label">Nueva contraseña</label>
        <input class="form-input" type="password" id="newPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        <div class="password-strength" id="passwordStrength"></div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Confirmar contraseña</label>
        <input class="form-input" type="password" id="confirmPassword" placeholder="Repite tu contraseña" autocomplete="new-password">
      </div>
      
      <div class="error-msg" id="resetError"></div>
      <div class="success-msg" id="resetSuccess"></div>
      
      <button class="btn-reset" onclick="doResetPassword()">Guardar nueva contraseña</button>
      
      <p style="margin-top:16px; font-size:13px; color:#999;">
        <a href="Portales/index.html" style="color:#9333ea; text-decoration:none;">← Volver al login</a>
      </p>
    </div>
  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://odbhxiymteppgaqqdsoy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kYmh4aXltdGVwcGdhcXFkc295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTc1NjUsImV4cCI6MjA5NTY3MzU2NX0.-AMG1zoszc05NJjAkXmm7kCZJuN3RA2OIzZRs221gkc';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // On page load: check for hash token
    window.addEventListener('DOMContentLoaded', async () => {
      const hash = window.location.hash;
      
      if (!hash || !hash.includes('access_token')) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('invalidState').style.display = 'block';
        return;
      }
      
      // Parse the hash
      const params = new URLSearchParams(hash.substring(1));
      const accessToken = params.get('access_token');
      const type = params.get('type');
      
      if (!accessToken || type !== 'recovery') {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('invalidState').style.display = 'block';
        return;
      }
      
      // Set the session with the recovery token
      try {
        const { error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: params.get('refresh_token') || ''
        });
        
        if (error) throw error;
        
        // Token is valid, show the form
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('resetForm').style.display = 'block';
        
        // Clear the hash
        window.history.replaceState(null, '', window.location.pathname);
      } catch (e) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('invalidState').style.display = 'block';
      }
    });

    // Password strength indicator
    document.getElementById('newPassword')?.addEventListener('input', (e) => {
      const val = e.target.value;
      const bar = document.getElementById('passwordStrength');
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      
      const colors = ['#dc2626', '#f59e0b', '#eab308', '#22c55e', '#16a34a'];
      const widths = ['20%', '40%', '60%', '80%', '100%'];
      
      bar.style.width = strength > 0 ? widths[strength - 1] : '0%';
      bar.style.background = strength > 0 ? colors[strength - 1] : '#e5e7eb';
    });

    async function doResetPassword() {
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('resetError');
      const successEl = document.getElementById('resetSuccess');
      
      errEl.style.display = 'none';
      successEl.style.display = 'none';
      
      if (!newPass) {
        errEl.textContent = 'Ingresa tu nueva contraseña.';
        errEl.style.display = 'block';
        return;
      }
      if (newPass.length < 6) {
        errEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        errEl.style.display = 'block';
        return;
      }
      if (newPass !== confirmPass) {
        errEl.textContent = 'Las contraseñas no coinciden.';
        errEl.style.display = 'block';
        return;
      }
      
      const btn = document.querySelector('.btn-reset');
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      
      try {
        const { error } = await supabase.auth.updateUser({ password: newPass });
        
        if (error) throw error;
        
        successEl.textContent = '¡Contraseña actualizada! Redirigiendo al portal...';
        successEl.style.display = 'block';
        btn.style.display = 'none';
        
        setTimeout(() => {
          window.location.href = 'Portales/index.html';
        }, 2000);
      } catch (error) {
        let msg = 'Error al actualizar la contraseña.';
        if (error.message?.includes('same')) msg = 'La nueva contraseña debe ser diferente a la anterior.';
        errEl.textContent = msg;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Guardar nueva contraseña';
      }
    }
  </script>
</body>
</html>
